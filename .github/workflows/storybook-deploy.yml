name: Publish Storybook

# Builds the Storybook in both languages and sends it to https://talisgalhardi.com/aipim/ over FTPS: Portuguese at the
# root (/aipim/) and English in /aipim/en/. The theme builder goes along, at /aipim/theme-builder/.
#
# It needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    the FTP host of the account
#   FTP_USERNAME  an FTP account locked to public_html/aipim (for example aipim@talisgalhardi.com)
#   FTP_PASSWORD  its password
# The account is locked to that folder, so for the server its root is "/" and nothing else on the site is reachable.
#
# After the first run only the files that changed are sent (the action keeps .ftp-deploy-sync-state.json in the folder).
# To check the connection without sending anything, run the workflow by hand with "dry_run" on.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be sent, without sending it
        type: boolean
        default: false

# The workflow only reads the repository.
permissions:
  contents: read

# One deploy at a time; a second one waits for the first to finish.
concurrency:
  group: storybook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Forks have no secrets: only the original repository publishes.
    if: github.repository == 'talis-galhardi/aipim'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the Storybook (Portuguese and English)
        run: npm run build-storybook:all
      # The theme builder (the whole folder) is a static page next to the Storybook, at /aipim/theme-builder/. It links the tokens and the
      # component CSS by their path in the repository (../tokens/..., ../components/...), so they go along at the same paths.
      - name: Add the theme builder
        run: |
          mkdir -p storybook-static/theme-builder storybook-static/tokens/build/css storybook-static/components/web
          cp -R theme-builder/. storybook-static/theme-builder/
          cp tokens/build/css/aipim.css storybook-static/tokens/build/css/
          cp components/web/aipim-components.css storybook-static/components/web/
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0, pinned by commit like the portfolio
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          protocol: ftps
          local-dir: ./storybook-static/
          dry-run: ${{ inputs.dry_run == true }}
