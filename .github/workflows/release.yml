name: Release

# Runs when a version tag is pushed (git tag v1.0.0 && git push --tags).
# Publishes to npm with trusted publishing: no token, and only after the maintainer approves the run. npm trusts this repository and this file
# (set once with `npm trust github aipim-ds --repo talis-galhardi/aipim --file release.yml --allow-publish`,
# or on the package page on npmjs.com, Settings, Trusted Publisher). If you rename this file, update npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # trusted publishing (OIDC) and npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The job waits here until the maintainer approves it in GitHub (Settings, Environments, npm). The same name is set on the npm Trusted Publisher.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: The tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Generated files are up to date
        run: |
          python3 tools/build_tokens.py --check
          python3 tools/build_web.py --check
          python3 tools/build_ai.py --check
          python3 tools/build_tutorials.py --check
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
