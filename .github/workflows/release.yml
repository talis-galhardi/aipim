name: Release

# Runs when a version tag is pushed (git tag v1.0.0 && git push --tags).
# Publishes to npm with trusted publishing: no token. npm trusts this repository and this file
# (set once with `npm trust github aipim-ds --repo talis-galhardi/aipim --file release.yml --allow-publish`,
# or on the package page on npmjs.com, Settings, Trusted Publisher). If you rename this file, update npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # trusted publishing (OIDC) and npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: The tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Generated files are up to date
        run: |
          python3 tools/build_tokens.py --check
          python3 tools/build_web.py --check
          python3 tools/build_ai.py --check
          python3 tools/build_workflow.py --check
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
