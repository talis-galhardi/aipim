name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; a job that needs more asks for it on its own.
permissions:
  contents: read

jobs:
  # The generated files match their sources, and the docs match the repository. Only the Python standard library and Node.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Every quick check (the list is in tools/check.py)
        run: python3 tools/check.py

  # The web components in three browser engines (Chromium, WebKit, Firefox), also in forced colors: axe, keyboard, 200% zoom, 320px reflow and text spacing.
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: pip install playwright && playwright install --with-deps ${{ matrix.engine }}
      # WebKit on the hosted runner fails now and then on timing: the same checks pass on the next run and on a
      # laptop. That engine gets three attempts; a real regression fails all three. The other engines run once.
      - name: Browser checks, normal and forced colors
        env:
          ENGINE: ${{ matrix.engine }}
          ATTEMPTS: ${{ matrix.engine == 'webkit' && 3 || 1 }}
        run: |
          for mode in "" "--forced-colors"; do
            n=0
            until python3 tools/verify_web.py --browser "$ENGINE" $mode; do
              n=$((n + 1))
              if [ "$n" -ge "$ATTEMPTS" ]; then echo "Failed after $n attempt(s) ($ENGINE $mode)"; exit 1; fi
              echo "Attempt $n failed ($ENGINE $mode), trying again"
            done
          done
      - name: The theme builder page (axe in light and dark, export blocked while a check fails)
        env:
          ENGINE: ${{ matrix.engine }}
        run: python3 tools/verify_theme_builder.py --browser "$ENGINE"

  # Builds the Storybook in both languages (Portuguese at the root, English in en/) and checks, in Chromium, that it opens
  # without errors and that its docs pages work (tabs, language, phone, axe). A new Storybook that breaks them fails here.
  storybook-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook:all
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/verify_storybook.py storybook-static

  # Builds the Storybook and publishes it to Chromatic (visual review of every story, light and dark).
  # Needs the repository secret CHROMATIC_PROJECT_TOKEN (Settings > Secrets and variables > Actions).
  storybook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: chromaui/action@38afd264ef2241136f12d039093c2724748bec08 # v18.11.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          autoAcceptChanges: main
