name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; a job that needs more asks for it on its own.
permissions:
  contents: read

jobs:
  # The generated files must match their sources. Nothing to install: the tools use only the Python standard library.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Tokens, outputs and the contrast checks
        run: python3 tools/build_tokens.py --check
      - name: Component CSS bundle
        run: python3 tools/build_web.py --check
      - name: AI package (AGENTS.md table, llms.txt, llms-full.txt)
        run: python3 tools/build_ai.py --check
      - name: Tutorials guide
        run: python3 tools/build_tutorials.py --check

  # The web components in three browser engines (Chromium, WebKit, Firefox), also in forced colors: axe, keyboard, 200% zoom, 320px reflow and text spacing.
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: pip install playwright && playwright install --with-deps ${{ matrix.engine }}
      # WebKit on the hosted runner fails now and then on timing: the same checks pass on the next run and on a
      # laptop. That engine gets three attempts; a real regression fails all three. The other engines run once.
      - name: Browser checks, normal and forced colors
        env:
          ENGINE: ${{ matrix.engine }}
          ATTEMPTS: ${{ matrix.engine == 'webkit' && 3 || 1 }}
        run: |
          for mode in "" "--forced-colors"; do
            n=0
            until python3 tools/verify_web.py --browser "$ENGINE" $mode; do
              n=$((n + 1))
              if [ "$n" -ge "$ATTEMPTS" ]; then echo "Failed after $n attempt(s) ($ENGINE $mode)"; exit 1; fi
              echo "Attempt $n failed ($ENGINE $mode), trying again"
            done
          done

  # The Storybook is changed in places Storybook has no API for (the menu, the bar of a phone, the tabs of a docs page).
  # This builds it and checks, in Chromium, that those changes still work: a new Storybook that breaks one fails here.
  storybook-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx storybook build -o storybook-static
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/verify_storybook.py storybook-static

  # Builds the Storybook and publishes it to Chromatic (visual review of every story, light and dark).
  # Needs the repository secret CHROMATIC_PROJECT_TOKEN (Settings > Secrets and variables > Actions).
  storybook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: chromaui/action@38afd264ef2241136f12d039093c2724748bec08 # v18.11.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          autoAcceptChanges: main
