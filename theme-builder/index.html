<!-- Three zones, like a checkout: the choices on the page background, the preview on a recessed stage and, on the right,
     the summary of the theme in a raised card that ends in the export. Depth sets the hierarchy, not borders. -->
<main class="tb-main" id="builder">
  <div class="tb-panel">
    <p class="tb-lead" data-t="lead"></p>

    <section class="tb-section" aria-labelledby="h-colors">
      <div class="tb-section__head"><h2 class="tb-overline" id="h-colors" data-t="colorsH"></h2>
        <button class="aipim-button aipim-button--ghost aipim-button--sm" type="button" id="reset"><svg class="aipim-icon aipim-button__icon-leading" aria-hidden="true"><use href="#aipim-refresh"></use></svg><span data-t="reset"></span></button></div>
      <button class="aipim-button aipim-button--outline aipim-button--sm tb-random" type="button" id="random"><span data-t="random"></span></button>
      <div id="colors" class="tb-card tb-colors"></div>
    </section>

    <section class="tb-section" aria-labelledby="h-usage">
      <div class="tb-section__head"><h2 class="tb-overline" id="h-usage" data-t="usageH"></h2>
        <div class="tb-seg" role="tablist" aria-labelledby="h-usage">
          <button class="tb-seg__opt" type="button" role="tab" id="tab-usage-light" aria-controls="usage" data-usage-mode="light" aria-selected="true"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-sun"></use></svg><span data-t="light"></span></button>
          <button class="tb-seg__opt" type="button" role="tab" id="tab-usage-dark" aria-controls="usage" data-usage-mode="dark" aria-selected="false" tabindex="-1"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-moon"></use></svg><span data-t="dark"></span></button>
        </div></div>
      <p class="tb-muted" data-t="usageLead"></p>
      <div id="usage" class="tb-card tb-usage" role="tabpanel" aria-labelledby="tab-usage-light"></div>
    </section>

  </div>

  <div class="tb-stage">
    <div class="tb-stage__head"><h2 class="tb-overline" id="h-preview" data-t="previewH"></h2><p class="tb-muted" data-t="previewLead"></p></div>

    <!-- "See as": the preview through a color-vision simulation (the same model as the checks), with the number of problems
         each condition has; the problems are also marked on the preview, numbered like the list in the summary. -->
    <div class="tb-sim">
      <p class="tb-sim__label" id="sim-label" data-t="simH"></p>
      <div class="tb-seg tb-sim__options" role="group" aria-labelledby="sim-label" id="sim-options"></div>
      <div class="tb-muted tb-sim__desc" id="sim-desc"></div>
      <p class="tb-muted tb-sim__note" data-t="simNote"></p>
    </div>

    <!-- Right above the preview, what changes only the preview: light or dark, and the marks. -->
    <div class="tb-toolbar">
      <div class="tb-seg" role="tablist" aria-labelledby="h-preview">
        <button class="tb-seg__opt" type="button" role="tab" id="tab-preview-light" aria-controls="preview-panel" data-preview-mode="light" aria-selected="true"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-sun"></use></svg><span data-t="light"></span><span class="tb-count" data-count="light" aria-hidden="true"></span><span class="aipim-visually-hidden" data-count-words="light"></span></button>
        <button class="tb-seg__opt" type="button" role="tab" id="tab-preview-dark" aria-controls="preview-panel" data-preview-mode="dark" aria-selected="false" tabindex="-1"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-moon"></use></svg><span data-t="dark"></span><span class="tb-count" data-count="dark" aria-hidden="true"></span><span class="aipim-visually-hidden" data-count-words="dark"></span></button>
      </div>
      <label class="aipim-checkbox tb-sim__marks"><input class="aipim-checkbox__input" type="checkbox" id="show-marks" checked><span class="aipim-checkbox__box" aria-hidden="true"></span><span class="aipim-checkbox__label" data-t="showMarks"></span></label>
    </div>

    <!-- The preview: real Aipim components. app.js puts the theme on this element as custom properties. data-roles names
         the roles an element shows, so a failing check can be marked on it. The marks sit outside the preview, so the
         simulation filter does not change their colors. -->
    <div id="preview-panel" role="tabpanel" aria-labelledby="tab-preview-light" tabindex="0"><div class="tb-preview-wrap"><div class="tb-preview" id="preview" inert>
      <header class="aipim-top-bar"><p class="aipim-top-bar__title" data-t="pvBar"></p><span class="aipim-icon-button"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-search"></use></svg></span><span class="aipim-icon-button"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-more-vertical"></use></svg></span></header>
      <div class="tb-preview__body">
        <article class="aipim-card" data-roles="bg.surface text.primary text.secondary text.muted">
          <div class="aipim-card__body">
            <div class="aipim-card__header"><span class="aipim-badge aipim-badge--square aipim-badge--tint" aria-hidden="true"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-bell"></use></svg></span><div class="aipim-card__heading"><p class="aipim-card__eyebrow" data-t="pvEyebrow"></p><p class="aipim-card__title" data-t="pvCardTitle"></p></div></div>
            <p class="aipim-card__text"><span data-t="pvCardText"></span> <a class="aipim-link" href="#" tabindex="-1" data-t="pvLink" data-roles="link link.hover link.visited"></a>.</p>
            <div class="tb-row"><span class="aipim-tag"><span data-t="pvTag"></span></span><span class="aipim-tag aipim-tag--accent" data-roles="accent.bg accent.text"><span data-t="pvNew"></span></span><span class="aipim-badge aipim-badge--sm aipim-badge--filled" aria-hidden="true">3</span></div>
            <div class="tb-row"><span class="aipim-button" data-roles="action.primary.bg action.primary.text action.primary.hover"><span data-t="pvPublish"></span></span><span class="aipim-button aipim-button--secondary" data-roles="action.secondary.bg action.secondary.text action.secondary.hover"><span data-t="pvPreview"></span></span><span class="aipim-button aipim-button--outline"><span data-t="pvCancel"></span></span></div>
          </div>
        </article>

        <div class="tb-cols">
          <div class="aipim-field"><label class="aipim-field__label" for="pv-f1" data-t="pvEmail"></label><input class="aipim-field__control" id="pv-f1" type="text" value="ana@exemplo.com" tabindex="-1" data-roles="border.strong"></div>
          <div class="aipim-field"><label class="aipim-field__label" for="pv-f2" data-t="pvEmail"></label><input class="aipim-field__control" id="pv-f2" type="text" value="ana@" aria-invalid="true" aria-describedby="pv-f2-h" tabindex="-1"><p class="aipim-field__helper" id="pv-f2-h"><svg class="aipim-icon aipim-field__icon" aria-hidden="true"><use href="#aipim-error"></use></svg><span data-t="pvEmailError"></span></p></div>
        </div>

        <div class="tb-cols">
          <div class="aipim-choice-group"><label class="aipim-checkbox"><input class="aipim-checkbox__input" type="checkbox" checked tabindex="-1"><span class="aipim-checkbox__box" aria-hidden="true"></span><span class="aipim-checkbox__label" data-t="pvNews"></span></label><label class="aipim-radio"><input class="aipim-radio__input" type="radio" name="pv-r" checked tabindex="-1"><span class="aipim-radio__circle" aria-hidden="true"></span><span class="aipim-radio__label" data-t="pvMonthly"></span></label></div>
          <div class="aipim-choice-group"><label class="aipim-switch"><input class="aipim-switch__input" type="checkbox" role="switch" checked tabindex="-1"><span class="aipim-switch__track" aria-hidden="true"></span><span class="aipim-switch__label" data-t="pvNotify"></span></label><label class="aipim-radio"><input class="aipim-radio__input" type="radio" name="pv-r" tabindex="-1"><span class="aipim-radio__circle" aria-hidden="true"></span><span class="aipim-radio__label" data-t="pvYearly"></span></label></div>
        </div>

        <div class="tb-alerts">
          <div class="aipim-alert" data-roles="info.bg info.text info.icon"><svg class="aipim-icon aipim-alert__icon" aria-hidden="true"><use href="#aipim-info"></use></svg><div class="aipim-alert__content"><p class="aipim-alert__message" data-t="pvInfo"></p></div></div>
          <div class="aipim-alert aipim-alert--success" data-roles="success.bg success.text success.icon"><svg class="aipim-icon aipim-alert__icon" aria-hidden="true"><use href="#aipim-success"></use></svg><div class="aipim-alert__content"><p class="aipim-alert__message" data-t="pvSuccess"></p></div></div>
          <div class="aipim-alert aipim-alert--warning" data-roles="warning.bg warning.text warning.icon"><svg class="aipim-icon aipim-alert__icon" aria-hidden="true"><use href="#aipim-warning"></use></svg><div class="aipim-alert__content"><p class="aipim-alert__message" data-t="pvWarning"></p></div></div>
          <div class="aipim-alert aipim-alert--error" data-roles="error.bg error.text error.icon"><svg class="aipim-icon aipim-alert__icon" aria-hidden="true"><use href="#aipim-error"></use></svg><div class="aipim-alert__content"><p class="aipim-alert__message" data-t="pvError"></p></div></div>
        </div>

        <div class="tb-tints">
          <article class="aipim-card aipim-card--primary" data-roles="tint.primary tint.text tint.text.muted"><div class="aipim-card__body"><p class="aipim-card__title" data-t="pvTint1"></p><p class="aipim-card__text" data-t="pvTintText"></p></div></article>
          <article class="aipim-card aipim-card--secondary" data-roles="tint.secondary tint.text tint.text.muted"><div class="aipim-card__body"><p class="aipim-card__title" data-t="pvTint2"></p><p class="aipim-card__text" data-t="pvTintText"></p></div></article>
          <article class="aipim-card aipim-card--tertiary" data-roles="tint.tertiary tint.text tint.text.muted"><div class="aipim-card__body"><p class="aipim-card__title" data-t="pvTint3"></p><p class="aipim-card__text" data-t="pvTintText"></p></div></article>
          <article class="aipim-card aipim-card--success" data-roles="tint.success tint.text tint.text.muted"><div class="aipim-card__body"><p class="aipim-card__title" data-t="pvTint4"></p><p class="aipim-card__text" data-t="pvTintText"></p></div></article>
        </div>

        <div class="aipim-tabs tb-fake-tabs"><span class="aipim-tab is-current"><span data-t="pvTab1"></span></span><span class="aipim-tab"><span data-t="pvTab2"></span></span><span class="aipim-tab"><span data-t="pvTab3"></span></span></div>
      </div>
    </div><div class="tb-marks" id="marks" role="group"></div></div></div>
  </div>
  <!-- Panel 3: the summary of the theme, read like the summary of an order: the colors, one line per kind of check, what
       does not pass (each problem is a button that takes the preview to it; a second click makes its mark blink), the fix
       that passes, the status and the export. -->
  <aside class="tb-results" id="summary" aria-labelledby="h-summary" tabindex="-1">
    <div class="tb-summary">
      <div class="tb-summary__head">
        <h2 class="tb-overline" id="h-summary" data-t="summaryH"></h2>
        <span class="tb-dots" id="sum-dots" aria-hidden="true"></span>
      </div>
      <dl class="tb-lines" id="sum-lines"></dl>
      <div class="tb-summary__checks" id="checks"></div>
      <div class="tb-total" id="sum-total" role="status"></div>
      <section class="tb-export" aria-labelledby="h-export">
        <h3 class="aipim-visually-hidden" id="h-export" data-t="exportH"></h3>
        <button class="aipim-button aipim-button--lg tb-export__main" type="button" data-export="css"><svg class="aipim-icon aipim-button__icon-leading" aria-hidden="true"><use href="#aipim-download"></use></svg><span data-t="dlCss"></span></button>
        <div class="tb-export__more">
          <button class="aipim-button aipim-button--outline" type="button" data-export="figma"><svg class="aipim-icon aipim-button__icon-leading" aria-hidden="true"><use href="#aipim-copy"></use></svg><span data-t="copyFigma"></span></button>
          <button class="aipim-button aipim-button--outline" type="button" data-export="link"><svg class="aipim-icon aipim-button__icon-leading" aria-hidden="true"><use href="#aipim-link"></use></svg><span data-t="copyLink"></span></button>
        </div>
      </section>
      <ul class="tb-how">
        <li><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-download"></use></svg><span data-t="howCode"></span></li>
        <li><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-copy"></use></svg><span data-t="howFigma"></span></li>
      </ul>
    </div>
  </aside>
</main>

<!-- Narrower than three panels, the summary sits below everything else: this bar keeps its status in sight and leads to
     it. It hides while the summary is on the screen. -->
<div class="tb-bar" id="bar" hidden><span class="tb-bar__status" id="bar-status"></span><a class="aipim-button aipim-button--sm" href="#summary" id="bar-go"><span data-t="seeSummary"></span></a></div>

<dialog class="aipim-modal" id="fallback" aria-labelledby="fallback-title">
  <div class="aipim-modal__header"><h2 class="aipim-modal__title" id="fallback-title" data-t="copyFallback"></h2><button class="aipim-icon-button" type="button" id="fallback-close" aria-label="Fechar"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-close"></use></svg></button></div>
  <div class="aipim-modal__body"><textarea class="aipim-field__control tb-fallback" id="fallback-text" rows="8" readonly></textarea></div>
</dialog>

<!-- The tooltip of a mark on the preview: the same words as the problem in the checks. It stays while the pointer is on
     it, and Escape closes it (WCAG 1.4.13). -->
<div class="tb-tip" id="tip" role="tooltip" hidden></div>

<!-- Export with problems: says what fails and asks once per theme (Nielsen, "Confirmation Dialogs Can Prevent User
     Errors, If Not Overused"). The safe way out is the main button and has the focus. -->
<dialog class="aipim-modal" id="confirm-export" aria-labelledby="confirm-title" aria-describedby="confirm-lead">
  <div class="aipim-modal__header"><h2 class="aipim-modal__title" id="confirm-title"></h2><button class="aipim-icon-button" type="button" id="confirm-close" aria-label="Fechar"><svg class="aipim-icon" aria-hidden="true"><use href="#aipim-close"></use></svg></button></div>
  <div class="aipim-modal__body"><p id="confirm-lead"></p><ul class="tb-fails" id="confirm-list"></ul><p class="tb-muted" data-t="confirmFile"></p></div>
  <div class="aipim-modal__actions"><button class="aipim-button aipim-button--outline" type="button" id="confirm-go"><span></span></button><button class="aipim-button" type="button" id="confirm-back"><span data-t="confirmBack"></span></button></div>
</dialog>

<script src="theme.js"></script>
<script src="copy.js"></script>
<script src="app.js"></script>
</body>
</html>
